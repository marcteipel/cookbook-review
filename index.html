<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#261f2b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Privately review a family cookbook, one handwritten passage at a time.">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css">
  <title>Yemek Kitabı · Review</title>
</head>
<body>
  <a class="skip-link" href="#main">Skip to review</a>
  <div class="app">
    <header class="masthead">
      <div class="brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M12 5c-3-2-6-2-9-1v15c3-1 6-1 9 1 3-2 6-2 9-1V4c-3-1-6-1-9 1Zm0 0v15"/></svg><span>Yemek Kitabı</span></div>
      <span class="privacy">Private on this device</span>
    </header>
    <div class="status-bar"><span id="save-status" role="status" aria-live="polite">Opening local storage…</span><span id="offline-status"></span></div>
    <div id="error" class="error" role="alert" hidden></div>
    <main id="main" tabindex="-1"><p>Opening your review…</p></main>
    <nav class="tabs" aria-label="App sections">
      <button type="button" data-tab="review" aria-current="page">Review</button>
      <button type="button" data-tab="history">History</button>
      <button type="button" data-tab="backup">Backup &amp; book</button>
    </nav>
  </div>
  <script type="module" src="./app.js"></script>
</body>
</html>
